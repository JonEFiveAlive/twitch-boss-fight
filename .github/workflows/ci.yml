# CI: runs the test suite on every push and pull request, works out the
# semantic version with GitVersion (rules in GitVersion.yml), and on pushes to
# main tags the commit vX.Y.Z and publishes a GitHub Release once tests pass.
# Results show up in the repo's "Actions" tab and as checks on each PR/commit.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# A newer push to the same branch/PR cancels the run still in progress,
# except on main, where a release might be halfway through being created.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Jobs only read the code unless they ask for more (the release job does).
permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the minimum (node:sqlite needs >= 22.13); 26 is the current LTS.
        node: [22, 26]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci installs exactly what package-lock.json pins. Playwright's npm
      # package doesn't download browsers on install, and no test needs one.
      - run: npm ci

      - run: npm test

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # GitVersion needs the full history and tags

      # GitTools actions v4 run GitVersion 6 on .NET 8.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: 6.x

      - id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Show version
        run: |
          echo "Version: ${{ steps.gitversion.outputs.semVer }}"
          echo "### Version: \`${{ steps.gitversion.outputs.semVer }}\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    needs: [test, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub Release
    steps:
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.majorMinorPatch }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG already released; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
